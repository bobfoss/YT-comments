[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
name = "yt-comments"
version = "0.1.0"
description = "Participating YouTube comment threads for YT Library"
requires-python = ">=3.11"

[project.entry-points."yt_library.plugins"]
comments = "yt_comments.plugin:YTCommentsPlugin"

[tool.setuptools.package-data]
yt_comments = ["*.js", "*.css", "ytl-plugin.json"]

[tool.ruff.lint]
select = ["F"]
